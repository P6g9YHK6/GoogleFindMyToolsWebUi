name: Publish Docker image

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Two runs of this workflow building at the same time (e.g. a push landing
# while an earlier push's build is still running) used to both read from and
# write to the same shared "type=gha" cache scope below. GitHub's Actions
# cache isn't safe against that - concurrent writes to one scope can leave
# it holding blobs that don't actually match what a later build's layers
# hash to, so a build can silently "cache hit" onto a stale layer instead of
# rebuilding it, even though its build args (GFMT_BUILD_SHA, the app code
# via COPY) changed. That's exactly what happened on 2026-08-12: the image
# ended up a mix of days-old and current files despite every run reporting
# success. Queuing runs instead of letting them overlap removes the
# concurrent-write case entirely; switching the cache itself to the
# registry backend below removes the other half - a registry cache push is
# one atomic tag replace, not an incrementally-mutated shared index.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image owner
        id: owner
        run: echo "lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lower }}/googlefindmytools
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Record build date
        id: build_date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GFMT_BUILD_SHA=${{ github.sha }}
            GFMT_BUILD_DATE=${{ steps.build_date.outputs.date }}
            GFMT_BUILD_BRANCH=${{ github.ref_name }}
          # Registry cache instead of "type=gha": a normal image push under
          # a dedicated :buildcache tag, so it's content-addressed and each
          # push atomically replaces the whole cache manifest - no shared
          # mutable index that concurrent runs (or GHA's own cache eviction)
          # can leave in an inconsistent state. See the concurrency block
          # above for the other half of this fix.
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lower }}/googlefindmytools:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lower }}/googlefindmytools:buildcache,mode=max
