name: Lint and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Syntax sweep
        run: python -m py_compile $(git ls-files '*.py')

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy webui

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-web.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --cov=webui --cov-report=term-missing

  lock-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Regenerate lock file
        run: |
          ~/.local/bin/uv pip compile \
            requirements.txt requirements-web.txt \
            -o requirements.lock \
            --python-version 3.11 \
            --generate-hashes

      - name: Check for drift
        run: |
          if ! git diff --exit-code requirements.lock; then
            echo "::error::requirements.lock is out of date. Regenerate with:"
            echo "::error::  uv pip compile requirements.txt requirements-web.txt -o requirements.lock --python-version 3.11 --generate-hashes"
            exit 1
          fi

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: pip-audit
        run: |
          pip-audit -r requirements.txt -r requirements-web.txt \
            --ignore-vuln PYSEC-2026-1325
        # PYSEC-2026-1325: the Minerva timing side-channel in python-ecdsa's
        # sign_digest()/ECDH path. Upstream has explicitly said side-channel
        # attacks are out of scope and there's no planned fix - failing CI on
        # it forever wouldn't catch anything actionable. Revisit if ecdsa
        # ships a fix, or gets replaced (see FMDNCrypto/, Auth/firebase_messaging/).
