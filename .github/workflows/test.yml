name: Lint and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Syntax sweep
        run: python -m py_compile $(git ls-files '*.py')

      - name: Ruff
        run: ruff check .

      - name: mypy (advisory)
        # webui/ currently has ~29 real type errors (loosely-typed config
        # dicts passed around as dict[Any, Any], mostly - see pyproject.toml's
        # [tool.mypy]). Not blocking merges on those yet since fixing them
        # properly means real design changes (TypedDicts for endpoint/device
        # config), not one-line fixes - this just keeps the count visible in
        # every run instead of silently drifting further.
        continue-on-error: true
        run: mypy webui

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-web.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --cov=webui --cov-report=term-missing

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: pip-audit
        run: |
          pip-audit -r requirements.txt -r requirements-web.txt \
            --ignore-vuln PYSEC-2026-1325
        # PYSEC-2026-1325: the Minerva timing side-channel in python-ecdsa's
        # sign_digest()/ECDH path. Upstream has explicitly said side-channel
        # attacks are out of scope and there's no planned fix - failing CI on
        # it forever wouldn't catch anything actionable. Revisit if ecdsa
        # ships a fix, or gets replaced (see FMDNCrypto/, Auth/firebase_messaging/).
