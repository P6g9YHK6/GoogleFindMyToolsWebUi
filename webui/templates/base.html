<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GoogleFindMyTools{% endblock %}</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <nav>
    <a href="/" class="brand"><img src="/static/logo.png" alt="" width="28" height="28">GoogleFindMyTools</a>
    <a href="/">Devices</a>
    <a href="/register">Register Tracker</a>
    <a href="/settings">Forwarding Settings</a>
    <a href="/logs">Logs</a>
    <a href="/auth">Config</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
