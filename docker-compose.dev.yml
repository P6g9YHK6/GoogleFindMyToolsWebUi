# Build-from-source setup: docker compose -f docker-compose.dev.yml up --build
# For the ready-to-use setup that pulls the pre-built image, use docker-compose.yml
# instead.
#
# Single container: Chrome/Xvfb/x11vnc/noVNC are installed on demand into a
# tmpfs mount the first time a login is triggered, then left in place for the
# rest of this container's life so later logins skip straight past that
# ~30-90s setup - only removed for real on a clean shutdown (see
# webui/browser_provisioning.py). That means this container needs outbound
# network access (Debian mirrors + storage.googleapis.com) the first time a
# login is triggered, not just at image build time.
#
# stop_grace_period: that shutdown-time cleanup (apt purge + removing the
# downloaded Chrome build) can take longer than Docker's default 10s SIGKILL
# timeout - give it real room to finish instead of getting killed mid-purge.
#
# LAN-only setup: no auth/HTTPS in front of the service. See the "Web UI"
# section in README.md before exposing this beyond your own network.
services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "4321:4321"
    # Chrome under Xvfb needs more than Docker's default 64MB /dev/shm.
    shm_size: "1g"
    tmpfs:
      - /run/gfmt-browser
    stop_grace_period: 30s
    environment:
      # Set this to protect the web UI (and the embedded Chrome login it
      # shows) with a password. Leave unset only on a fully trusted LAN.
      - WEBUI_PASSWORD=${WEBUI_PASSWORD:-}
    volumes:
      - secrets:/data/auth
      - ./webui/data:/app/webui/data
    restart: unless-stopped

volumes:
  secrets:
