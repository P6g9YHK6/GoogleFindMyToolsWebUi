# Build-from-source setup: docker compose -f docker-compose.dev.yml up --build
# For the ready-to-use setup that pulls pre-built images, use docker-compose.yml
# instead.
#
# LAN-only setup: no auth/HTTPS in front of either service. See the "Web UI"
# section in README.md before exposing these ports beyond your own network.
services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - BROWSER_AGENT_URL=http://browser:8001
      - BROWSER_NOVNC_URL=http://browser:6901
      # Set this to protect the web UI (and the embedded Chrome login it
      # proxies) with a password. Leave unset only on a fully trusted LAN.
      - WEBUI_PASSWORD=${WEBUI_PASSWORD:-}
    volumes:
      - secrets:/app/Auth/secrets.json
      - ./webui/data:/app/webui/data
    depends_on:
      - browser

  browser:
    build:
      context: .
      dockerfile: docker/browser/Dockerfile
    # Chrome under Xvfb needs more than Docker's default 64MB /dev/shm.
    shm_size: "1g"
    # No published ports: the web service proxies noVNC through its own
    # origin (webui/routers/vnc_proxy.py), so this container is only
    # reachable from other containers on the compose network.
    volumes:
      - secrets:/app/Auth/secrets.json

volumes:
  secrets:
