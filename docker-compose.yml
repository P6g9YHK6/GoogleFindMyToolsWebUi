# Ready-to-use setup: pulls the pre-built image published by GitHub Actions to
# ghcr.io (see .github/workflows/docker-publish.yml) instead of building
# locally. To build from source instead, use:
#   docker compose -f docker-compose.dev.yml up --build
#
# Single container: Chrome/Xvfb/x11vnc/noVNC are installed on demand only
# while a login is in progress, into a tmpfs mount, and removed again
# afterward - see webui/browser_provisioning.py. That means this container
# needs outbound network access (Debian mirrors + storage.googleapis.com)
# whenever a login is triggered, not just at image build time.
#
# LAN-only setup: no HTTPS in front of the service, and no password unless
# WEBUI_PASSWORD is set (e.g. via a .env file, see .env.example). See the
# "Web UI" section in README.md before exposing this beyond your own network.
services:
  web:
    image: ghcr.io/p6g9yhk6/googlefindmytools:latest
    ports:
      - "4321:4321"
    # Chrome under Xvfb needs more than Docker's default 64MB /dev/shm.
    shm_size: "1g"
    tmpfs:
      - /run/gfmt-browser
    environment:
      - WEBUI_PASSWORD=${WEBUI_PASSWORD:-}
    volumes:
      - secrets:/data/auth
      - ./webui/data:/app/webui/data
    restart: unless-stopped

volumes:
  secrets:
