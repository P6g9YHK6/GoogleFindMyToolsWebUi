# Ready-to-use setup: pulls the pre-built image published by GitHub Actions to
# ghcr.io (see .github/workflows/docker-publish.yml) instead of building
# locally. To build from source instead, use:
#   docker compose -f docker-compose.dev.yml up --build
#
# Single container: Chrome/Xvfb/x11vnc/noVNC are installed on demand into a
# tmpfs mount the first time a login is triggered, then left in place for the
# rest of this container's life (including across a plain `docker stop`/
# `start`, not just within one "up") so later logins skip straight past that
# ~30-90s setup - see webui/browser_provisioning.py. That means this
# container needs outbound network access (Debian mirrors +
# storage.googleapis.com) the first time a login is triggered, not just at
# image build time. Shutdown itself only stops those processes (no apt
# purge), so Docker's default stop grace period is plenty; if a process ever
# fails to exit cleanly, the Config page (/auth) shows a warning instead.
#
# One volume: everything (Google auth tokens, per-device forwarding config,
# location history, logs) lives flat in one directory, /data in the image's
# default env (see docker/web/Dockerfile), so a single volume mounted there
# covers all of it - no subfolders to keep track of.
#
# LAN-only setup by default: plain HTTP (set HTTPS_ENABLED=1 for a
# self-signed cert instead - see README.md's Security section), and no auth
# unless both HTTP_USER and HTTP_PASSWORD are set (e.g. via a .env file, see
# .env.example). See the "Web UI" section in README.md before exposing this
# beyond your own network.
services:
  web:
    image: ghcr.io/p6g9yhk6/googlefindmytools:latest
    ports:
      - "4321:4321"
    # Chrome under Xvfb needs more than Docker's default 64MB /dev/shm, and its
    # tmpfs mount needs exec (Docker defaults to noexec, which blocks running the
    # extracted Chrome binary with a misleading "Permission denied"). Leave both
    # on rather than toggling them off after signing in - the Firmware page's
    # on-demand ESP-IDF build also needs this container capable of that kind of
    # work, so there's no "done with it" point to comment them back out at.
    shm_size: "1g"
    tmpfs:
      - /run/gfmt-browser:rw,exec,nosuid,size=1g
    environment:
      - HTTP_USER=${HTTP_USER:-}
      - HTTP_PASSWORD=${HTTP_PASSWORD:-}
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY:-}
      - HTTPS_ENABLED=${HTTPS_ENABLED:-}
      - GFMT_TLS_SAN=${GFMT_TLS_SAN:-}
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
