# Ready-to-use setup: pulls the pre-built image published by GitHub Actions to
# ghcr.io (see .github/workflows/docker-publish.yml) instead of building
# locally. To build from source instead, use:
#   docker compose -f docker-compose.dev.yml up --build
#
# Single container: Chrome/Xvfb/x11vnc/noVNC are installed on demand into a
# tmpfs mount the first time a login is triggered, then left in place for the
# rest of this container's life so later logins skip straight past that
# ~30-90s setup - only removed for real on a clean shutdown (see
# webui/browser_provisioning.py). That means this container needs outbound
# network access (Debian mirrors + storage.googleapis.com) the first time a
# login is triggered, not just at image build time.
#
# stop_grace_period: that shutdown-time cleanup (apt purge + removing the
# downloaded Chrome build) can take longer than Docker's default 10s SIGKILL
# timeout - give it real room to finish instead of getting killed mid-purge.
#
# LAN-only setup: no HTTPS in front of the service, and no password unless
# WEBUI_PASSWORD is set (e.g. via a .env file, see .env.example). See the
# "Web UI" section in README.md before exposing this beyond your own network.
services:
  web:
    image: ghcr.io/p6g9yhk6/googlefindmytools:latest
    ports:
      - "4321:4321"
    # Chrome under Xvfb needs more than Docker's default 64MB /dev/shm.
    shm_size: "1g"
    # Docker's tmpfs mounts default to noexec, which silently blocks running
    # the Chrome binary extracted into this directory ("Permission denied",
    # not an actual file permission issue) - exec overrides that default.
    tmpfs:
      - /run/gfmt-browser:rw,exec,nosuid,size=1g
    stop_grace_period: 30s
    environment:
      - WEBUI_PASSWORD=${WEBUI_PASSWORD:-}
    volumes:
      - secrets:/data/auth
      - ./webui/data:/app/webui/data
    restart: unless-stopped

volumes:
  secrets:
