[supervisord]
nodaemon=true

[program:xvfb]
command=Xvfb :99 -screen 0 1280x900x24 -nolisten tcp
autorestart=true
priority=10

[program:x11vnc]
command=x11vnc -display :99 -nopw -forever -shared -rfbport 5900
autorestart=true
priority=20

; Serves the noVNC web client and proxies it to x11vnc over a websocket.
; Verify /usr/share/novnc exists in the built image (Debian's `novnc` package
; location) before relying on this in production - see README web UI section.
[program:novnc]
command=websockify --web=/usr/share/novnc 6901 localhost:5900
autorestart=true
priority=30

[program:browser-agent]
command=uvicorn browser_agent:app --host 0.0.0.0 --port 8001
directory=/app
autorestart=true
priority=40
